<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MetaKnow</title>
    <meta name="description" content="MetaKnow" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Favicon -->
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="assets/icons/site.webmanifest" />
    <meta name="theme-color" content="#5A6CF3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

    <script>
        // 提前应用主题，避免白屏闪烁
        (function () {
            var saved = localStorage.getItem('mk_theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <!-- ============================================================
         顶部导航栏
         ============================================================ -->
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <button class="hamburger" id="hamburgerBtn" aria-label="切换侧边栏" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <a class="nav-brand" href="#/">
                    <span class="brand-mark">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3 3 8l9 5 9-5-9-5Z"/>
                            <path d="m3 16 9 5 9-5"/>
                            <path d="m3 12 9 5 9-5"/>
                        </svg>
                    </span>
                    <span class="brand-text">MetaKnow</span>
                </a>
            </div>

            <div class="nav-actions">
                <!-- 搜索框 -->
                <div class="search-wrapper" id="searchWrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索…" autocomplete="off"
                           aria-label="搜索知识库" />
                    <button class="search-clear" id="searchClear" aria-label="清空搜索">
                        <i class="fas fa-times"></i>
                    </button>
                    <kbd class="search-kbd">⌘K</kbd>
                </div>

                <!-- 主题切换 -->
                <button class="nav-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
                    <i class="fas fa-circle-half-stroke"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 搜索结果面板 -->
    <div class="search-results" id="searchResults"></div>

    <!-- ============================================================
         移动端遮罩
         ============================================================ -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- ============================================================
         主体布局：左侧导航 | 中间正文 | 右侧目录
         ============================================================ -->
    <div class="main-wrapper" id="mainWrapper">

        <!-- 侧边栏（桌面端固定 / 移动端滑出） -->
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer" id="sidebarFooter"></div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content" id="mainContent">
            <div id="content-root">
                <!-- 内容由 JS 动态渲染 -->
            </div>
            <div id="giscus-container" class="giscus-container"></div>
        </main>

        <!-- 右侧目录（仅大屏显示） -->
        <aside class="desktop-toc" id="desktopToc">
            <div class="toc-title">本页目录</div>
            <nav class="toc-nav" id="tocNav"></nav>
        </aside>

    </div>

    <!-- ============================================================
         页脚
         ============================================================ -->
    <footer class="footer">
        <p>
            <span>MetaKnow</span>
            <span class="dot">·</span>
            <span>让知识自由流动</span>
        </p>
    </footer>
    <!-- ============================================================
         脚本
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
